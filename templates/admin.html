{% extends "base.html" %}

{% block title %}Admin Page{% endblock %}

{% block content %}
<h1>Admin Dashboard</h1>
<p>Review new users and approve to create them an account.</p>

<div class="user-list">
    
    {% for user in users %}
    <div class="user-card">
        <p><strong>{{ user.username }}</strong></p>
        <p>{{ user.phone }}</p>
        <div class="actions">
            <form method="POST" action="{{ url_for('approve_user') }}" style="display:inline">
                <input type="hidden" name="username" value="{{ user.username }}">
                <button type="submit" class="button-primary">Approve</button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
