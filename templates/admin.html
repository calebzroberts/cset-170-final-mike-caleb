{% extends "base.html" %}

{% block title %}Admin Page{% endblock %}

{% block content %}
<h1>Admin Dashboard</h1>
<p>Review new users and approve to create them an account.</p>

<div class="user-list">
    
    {% for user in users %}
    <div class="user-card">
        <p><strong>{{ user.name }}</strong></p>
        <p>{{ user.email }}</p>
        <div class="actions">
            <button class="button-primary approve-btn">Approve</button>
            <button class="button-outline reject-btn">Reject</button>
        </div>
    </div>
    {% endfor %}
</div>

<script>
    // Select all approve/reject buttons
    document.querySelectorAll('.approve-btn, .reject-btn').forEach(button => {
        button.addEventListener('click', function() {
            const card = this.closest('.user-card'); // find the card
            card.remove(); // remove it from the DOM
        });
    });
</script>

{% endblock %}
