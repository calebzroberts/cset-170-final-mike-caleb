<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/bank-style.css') }}">
</head>
<body>
    <header class="navbar">
        <!-- Brand / Logo Section -->
        <div class="brand">
            <div class="logo">M&C</div> <!-- Replace with an icon or initials -->
            <span class="title">Mike & Caleb's Bank</span>
        </div>

        <!-- Navigation Links -->
        <nav class="nav-links">
            <a href="/">Main</a>
            {% if is_admin %}
            <a href="/admin">Admin</a>
            {% else %}
            <a href="/account">My Account</a>
            <a href="/transfer">Transfer</a>
            {% endif %}
        </nav>

        {% if logged_in %}
            <div class="loggedInBtns">
                
                <a href="/account" class="profile-link">
                    <div class="profile" title="User Profile">
                        <p>: )</p>
                    </div>
                </a>

                <a href="/logout" class="button-outline">Logout</a>
            </div>
        {% else %}
            <div class="loginSignupBtns">
                
                <a class="button-primary" href="/login">Login</a>
                <a class="button-outline" href="/signup">Sign Up</a>
            </div>
        {% endif %}
    </header>
    
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
