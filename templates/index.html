{% extends "base.html" %}

{% block title %}Main Page{% endblock %}

{% block content %}
<h1>Welcome to Our Banking App!</h1>
<p>Here you can either log in to manage your account or sign up if you are a new user.</p>
<div class="actions">
        
    <a href="/login" class="button-outline">Log In</a>
    <a href="/signup" class="button-primary">Sign Up</a>
</div>



<h2 class="danger-heading">Danger Zone</h2>
<p>This will reset the simulation.</p>
<div class="actions">
    <button class="button-outline" onclick="window.location.reload()">Reset Database</button>
</div>
{% endblock %}
